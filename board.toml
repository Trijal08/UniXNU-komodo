# UniXNU device repository for the Google Pixel 9 Pro XL (komodo, Tensor G4 "zumapro").
# Values marked TODO are device inputs that have not been measured yet. Everything else is
# taken from the mainline komodo device tree or from the sheng reference port (same IPSW).

[board]
name = "komodo"
soc = "zumapro"
description = "Google Pixel 9 Pro XL"
kit = "komodo"

# Bring-up target. iPad7,1 iPadOS 17.7.11 is the newest arm64 (non-PAC) image the base stack is
# qualified against; it is used to prove the hardware before switching to an iPhone target.
# Bring-up target for the iOS 26 line. iPhone18,2 (iPhone 17 Pro Max, V54) 26.5.2 is the newest
# published release whose kernel source Apple has shipped (xnu-12377.121.6), and it is arm64e, which
# komodo's Cortex-X4 can run natively. The zeta port uses the same image, so its recorded device
# class and board id are reused rather than guessed.
[ipsw]
url = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-26432/CF51E589-7C43-4B55-B909-CF585DAD0570/iPhone18,2_26.5.2_23F84_Restore.ipsw"
product = "iPhone18,2"
version = "26.5.2"
build = "23F84"
device_class = "v54ap"
chip_id = 0x8150
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# No [ipsw.sha256] pins yet: the member digests of this image have not been recorded here. The
# userdata step prints the digest of every image it expands, so they are filled in from a first run.

# The Darwin root goes into the GPT partition named "darwin" (sda37), carved out of the end of the
# "linux" partition on 2026-10-21: exactly 64 GiB, 1 MiB aligned, UFS LUN 0, 4096-byte sectors,
# 512 GB model. Android's userdata and the postmarketOS root stay intact. The 2 GiB "esp" partition
# (sda35, LBA 0x5696200) carries the payload volume. The Exynos UFS driver must look for "darwin"
# where NativeUfs looks for "userdata", and the flash target is `fastboot flash darwin`.
[userdata]
# The GPT partition that carries the root image (sheng: userdata; komodo: the darwin partition carved from linux).
partition = "darwin"
first_lba = 0x6715300
last_lba = 0x77152ff
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "komodo_defconfig"
# Archive builders of the kernel step, in order, from the sheng board minus NativeUfs and the Adreno
# path. build-sheng-platform-power.py is the original-ApplePMGR shim the payload step requires
# (symbol _sheng_pmgr_run); it holds no SM8550 code. It audits its vtable against an earlier prelink
# candidate in build/native-prelink, which only exists after a first kernel build.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py SoftwareAES",
  "build-software-aes-bindings.py",
  # The owner-signed policies over the OS and SystemOS windows of the root image (`unixnu build policies`),
  # as the archive the kernel links with CONFIG_XNU_VERIFIED_ROOT_PROBE and the verified NativeUfs reads.
  "build-verified-root-probe.py --component os --include-systemos",
  # The Tensor host glue, the darwin GPT partition for the root image, owner-verified reads (add
  # --unverified for a probe-only driver without the policies).
  "build-arm-driver.py NativeUfs --host exynos --root-partition darwin",
  # The verified VirtIO block layer with the two-volume policy bundle: it also answers the owner-root kernel's
  # root/volume/manifest queries (native_verified_block_*), so it is the archive the kernel links
  # (CONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE) even though komodo has no VirtIO transport.
  "build-arm-driver.py VirtioMmioBlock --verified-root --verified-root-bundle",
  "build-arm-driver.py RamBlock",
  "build-virtio-mmio-bindings.py --component RamBlock --directory build/native-ram-block",
  "build-virtio-mmio-bindings.py --component VirtioMmioBlock --directory build/native-virtio-block-verified-bundle",
  "build-mockfs-fixture.py",
  "build-sheng-platform-power.py",
  "build-boot-progress.py",
  "build-libpthread-kernel.py",
  "build-gop-legacy-display.py",
  # Link stubs for the diagnostics of drivers komodo does not link (CONFIG_XNU_EXTRA_LD_ARCHIVES).
  "build-komodo-linkstubs.py",
]

# The prelink step does not run against this IPSW. iPhone18,2 23F84 ships an SPTM kernelcache
# (MH_FILESET, __DATA_SPTM, libsptm_init), so its kexts are built against a monitor ABI that a
# NO_MONITOR BCM2837 kernel cannot present; reaching iOS 26 userland needs a non-monitor target.
# kernelcache_sha256 is the digest of the decompressed arm64e slice, measured 2026-10-26.
# early_security_init is an address inside the original kernelcache and has to be re-measured for
# whichever cache is adopted; the 17.7.11 value it used to hold is gone rather than silently wrong.
[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu-12377.121.6/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "b864d456e3d74b2f83fea07645893a26f56203938e611541e39a84bbdc4f2b22"
slide = "-0x1000000"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# Mu-Silicium port "caimito" (Pixel 9 family); DEVICE_MODEL 0 selects komodo. The port's FDF already
# carries UFS, PartitionDxe, Fat, SimpleFb (1344x2992), Keypad, serial console and BdsDxe. UniXNU
# and DarwinBoot are not embedded: the firmware volume is pinned at 0x201000 bytes with the UEFI
# stack right behind it, so UniXNU runs from the ESP as EFI/BOOT/BOOTAA64.EFI (BdsDxe default) and
# DarwinBoot.efi ships in the payload (see # First boot on the iOS 26 line, modelled on the zeta port's bring-up payload: the smallest argument
# set that still gives a serial log. Deliberately omitted for now:
#   native-ufs-root / sheng-pmgr   the payload step requires the kernel to export _sheng_pmgr_run
#                                  when a native UFS root is asked for, and the PMGR shim is not
#                                  ported to xnu-12377 yet. Without the argument the gate does not
#                                  apply and the kernel still publishes the UFS media.
#   the offline-* shim set         those were qualified against the 17.7.11 userland.
#   root_match_volume_uuid         set once the OS volume UUID of the iOS 26 root image is read.
[payload]
volume = "KOMODOESP"
size_mib = 192
loader = "payload"                  # DarwinBoot.efi ships in the payload, not the firmware volume
title = "komodo iOS 26 first boot: iPhone18,2 23F84"
dram_size = "0x80000000"
# The entry probe's bars stay; its reset stages are out, because they do not fit alongside the panic
# screen and they have answered their questions. Stage 3: the phone reset on time, so the CPU gets
# through the 16 KiB MMU enable. Stage 4 at _PE_init_platform: no reset, so the hang was in the
# first nine calls of arm_init -- which is OSRuntimeSignStructors, the one piece of work that exists
# only when HAS_APPLE_PAC is defined (patches/xnu-12377/zzw-native-pac-keys.patch).
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e", "native-ufs-probe=16"]
# The bundle of the StaticTrustCache and Cryptex1,SystemTrustCache members of this IPSW, in the order
# the [userdata] windows carry them (scripts/build-trust-bundle.py): 3576 + 116 entries. Pinning the
# digest is what proves the modules reached the payload unchanged.
trust_cache_sha256 = ["a55251b2216960e6d307782fd98d2415f59cafa1ccde31bab6110ad8c87aef4e"]

[payload.adt]
tool = "scripts/make-komodo-adt.py"
chip_id = "207"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
unique_chip_id = "required"
# No identity block: the iPad7,1 one belongs to the 17.7.11 userland and would misdescribe this root
# image. The security tuple it used to carry is not part of an identity, and iOS 26 still has to read
# the AP as dev-fused and undemoted, so it is asked for on its own.
dev_fused = true

